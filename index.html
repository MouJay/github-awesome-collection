<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 酷東西收藏庫</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0d1117;color:#e6edf3}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1100px;margin:auto;padding:26px 20px}h1{margin:10px 0;font-size:clamp(26px,4vw,42px)}p,.muted{color:#8b949e}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:12px;font:inherit}input{flex:1;min-width:190px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:10px 14px;border-radius:9px;cursor:pointer}.tabs button.active{background:#1f6feb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin:20px 0}.card{border:1px solid #30363d;background:#161b22;border-radius:14px;padding:20px;min-width:0}.card h2{font-size:19px;overflow-wrap:anywhere}.card a{color:#79c0ff;text-decoration:none}.pill{font-size:12px;border:1px solid #30363d;border-radius:99px;padding:5px 9px;display:inline-block;margin-right:5px}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:18px;color:#8b949e;font-size:13px}#compare{display:none}table{width:100%;border-collapse:collapse;min-width:600px}td,th{border-bottom:1px solid #30363d;padding:12px;text-align:left}th{color:#8b949e}#comparisonWrap{overflow:auto}.action{background:#238636;color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;cursor:pointer}.action:disabled{opacity:.45;cursor:not-allowed}.pick{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:8px;padding:9px 12px;cursor:pointer}.pick[aria-pressed="true"]{background:#1f6feb}.card .summary{min-height:55px}footer{font-size:13px;color:#8b949e}</style></head>
<body><header><p>✦ OPEN SOURCE COLLECTION</p><h1>GitHub 酷東西收藏庫</h1><p>值得收藏的開源專案，一站搜尋、分類與比較。尚未查證的資料明確標示「待確認」。</p><nav class="tabs"><button class="active" id="browseBtn">專案總覽</button><button id="compareBtn">類似專案比較</button><button id="discoverBtn">搜尋類似專案</button></nav></header><main><section id="browse"><div class="bar"><input id="search" placeholder="搜尋專案、分類或介紹…" aria-label="搜尋"><select id="category" aria-label="分類"><option value="">所有分類</option></select><select id="sort" aria-label="排序"><option value="name">名稱 A–Z</option><option value="stars">Star 數高到低</option></select></div><p id="count" class="muted"></p><div class="grid" id="cards"></div></section><section id="compare"><h2>類似專案比較</h2><p>選擇分類，並列比較同類型專案；資料不足時不做優劣排名。</p><select id="compareCategory" aria-label="比較分類"></select><div id="comparisonWrap"><table><thead><tr><th>名稱</th><th>Stars</th><th>用途</th><th>安裝難度／平台</th><th>維護狀態</th></tr></thead><tbody id="compareRows"></tbody></table></div></section><section id="discover" style="display:none"><h2>搜尋 GitHub 類似專案</h2><p>從收藏庫選一個專案，或自行輸入搜尋關鍵字。搜尋結果不會自動加入收藏。</p><div class="bar"><select id="sourceProject" aria-label="參考收藏專案"></select><input id="discoverQuery" aria-label="GitHub 搜尋關鍵字" placeholder="例如 android tv player"><button id="discoverSearch" class="action">搜尋</button></div><p id="discoverStatus" role="status" class="muted">尚未搜尋。</p><div id="discoverResults" class="grid"></div><h2>待收藏清單</h2><p class="muted">選取候選後，複製清單貼到 ChatGPT，經你確認後才寫入 Repository。</p><div id="selectedList" class="muted">尚未選取專案。</div><div class="bar"><button id="copySelection" class="action" disabled>複製待收藏清單</button><button id="clearSelection" class="action">清空選取</button></div></section></main><footer>資料僅在手動匯入或更新時刷新。Star 數與維護狀態並非即時資訊。</footer>
<script>
let projects=[];const selected=new Map();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const txt=v=>v===null||v===undefined||v===''?'待確認':String(v);
function render(){const q=$('search').value.trim().toLocaleLowerCase(),cat=$('category').value;let list=projects.filter(p=>(!cat||p.category===cat)&&[p.name,p.id,p.description,p.category,p.recommendation].some(v=>String(v||'').toLocaleLowerCase().includes(q)));list.sort($('sort').value==='stars'?(a,b)=>(b.stars??-1)-(a.stars??-1)||a.name.localeCompare(b.name): (a,b)=>a.name.localeCompare(b.name));$('count').textContent='共 '+list.length+' 個專案';$('cards').innerHTML=list.map(p=>'<article class="card"><span class="pill">'+esc(p.category)+'</span><h2><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.name)+' ↗</a></h2><p>'+esc(txt(p.description))+'</p><p><strong>用途：</strong>'+esc(txt(p.recommendation))+'</p><p><strong>安裝：</strong>'+esc(txt(p.installation))+'</p><div class="meta"><span>★ '+esc(txt(p.stars))+'</span><span>'+esc(txt(p.maintenance))+'</span></div></article>').join('')||'<p>沒有符合的專案。</p>'}
function compare(){const cat=$('compareCategory').value;const list=projects.filter(p=>p.category===cat);$('compareRows').innerHTML=list.map(p=>'<tr><td><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.name)+'</a></td><td>'+esc(txt(p.stars))+'</td><td>'+esc(txt(p.recommendation))+'</td><td>'+esc(txt(p.installation))+'</td><td>'+esc(txt(p.maintenance))+'</td></tr>').join('')||'<tr><td colspan="5">尚無可比較的專案</td></tr>'}
function tab(which){for(const id of ['browse','compare','discover']){$(id).style.display=id===which?'block':'none';$(id+'Btn').classList.toggle('active',id===which)}if(which==='compare')compare()}
$('browseBtn').onclick=()=>tab('browse');$('compareBtn').onclick=()=>tab('compare');$('discoverBtn').onclick=()=>tab('discover');['search','category','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('compareCategory').onchange=compare;
fetch('./data/projects.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{projects=data;const cats=[...new Set(projects.map(p=>p.category))].sort();for(const c of cats){for(const id of ['category','compareCategory']){const o=document.createElement('option');o.value=c;o.textContent=c;$(id).append(o)}}render();compare();initDiscovery()}).catch(e=>{$('cards').textContent='讀取資料失敗：'+e.message});

function initDiscovery(){const select=$('sourceProject');select.innerHTML='<option value="">自訂關鍵字搜尋</option>';for(const p of projects){const o=document.createElement('option');o.value=p.id;o.textContent=p.name+'（'+p.category+'）';select.append(o)}select.onchange=()=>{const p=projects.find(x=>x.id===select.value);if(p)$('discoverQuery').value=({ 'AI Agent':'autonomous agent memory tools','MCP 工具':'model context protocol desktop automation','遊戲工具':'game compatibility mobile','影音工具':'android tv video player','電子書':'ebook library reader','命理工具':'astrology chart software','開發工具':'developer tools'}[p.category]||p.category)};select.value=projects[0]?.id||'';select.onchange()}
function renderSelected(){$('selectedList').textContent=selected.size?[...selected.values()].map(p=>p.full_name).join('、'):'尚未選取專案。';$('copySelection').disabled=!selected.size;document.querySelectorAll('[data-pick]').forEach(b=>{const yes=selected.has(b.dataset.pick);b.setAttribute('aria-pressed',String(yes));b.textContent=yes?'✓ 已選取':'＋ 加入待收藏'})}
$('discoverSearch').onclick=async()=>{const q=$('discoverQuery').value.trim();if(!q){$('discoverStatus').textContent='請輸入搜尋關鍵字';return}const btn=$('discoverSearch');btn.disabled=true;$('discoverStatus').textContent='正在搜尋 GitHub…';$('discoverResults').replaceChildren();try{const res=await fetch('https://api.github.com/search/repositories?q='+encodeURIComponent(q+' in:name,description,readme archived:false')+'&sort=best-match&per_page=20',{headers:{Accept:'application/vnd.github+json'}});if(!res.ok){if(res.status===403||res.status===429)throw Error('GitHub API 可能達到速率限制，請稍後再試（HTTP '+res.status+'）');throw Error('GitHub API HTTP '+res.status)}const data=await res.json();const saved=new Set(projects.map(p=>p.id.toLowerCase()));const origin=$('sourceProject').value.toLowerCase();const list=(data.items||[]).filter(p=>p.full_name.toLowerCase()!==origin);$('discoverStatus').textContent='找到 '+data.total_count+' 筆符合關鍵字的結果；顯示前 '+list.length+' 筆。'+(data.incomplete_results?'（GitHub 回報結果可能不完整）':'');for(const p of list){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');const a=document.createElement('a');a.href=p.html_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=p.full_name+' ↗';title.append(a);const desc=document.createElement('p');desc.className='summary';desc.textContent=p.description||'GitHub 未提供簡介';const meta=document.createElement('p');meta.className='muted';meta.textContent='★ '+p.stargazers_count+'　'+(p.language||'語言未提供')+'　更新：'+(p.pushed_at||'未知').slice(0,10);const badge=document.createElement('p');badge.textContent=saved.has(p.full_name.toLowerCase())?'已收藏':'尚未收藏';card.append(title,desc,meta,badge);if(!saved.has(p.full_name.toLowerCase())){const b=document.createElement('button');b.className='pick';b.dataset.pick=p.full_name;b.onclick=()=>{if(selected.has(p.full_name))selected.delete(p.full_name);else selected.set(p.full_name,p);renderSelected()};card.append(b)}$('discoverResults').append(card)}renderSelected()}catch(e){$('discoverStatus').textContent='搜尋失敗：'+e.message}finally{btn.disabled=false}};
$('copySelection').onclick=async()=>{const lines=[...selected.values()].map(p=>p.html_url).join('\n');const prompt='請將以下我挑選的 GitHub 專案加入 MouJay/github-awesome-collection。先核對 README、Stars、最後更新日期，產生繁體中文簡介、分類與用途建議，依 owner/repo 去重，更新 data/projects.json 並回報提交結果：\n'+lines;try{await navigator.clipboard.writeText(prompt);$('discoverStatus').textContent='已複製待收藏指令，請貼到 ChatGPT。'}catch(e){$('discoverStatus').textContent='瀏覽器無法自動複製，請手動複製以下內容：'+prompt}};
$('clearSelection').onclick=()=>{selected.clear();renderSelected()};
</script></body></html>
