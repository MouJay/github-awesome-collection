<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub 酷東西收藏庫</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0d1117;color:#e6edf3}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1100px;margin:auto;padding:26px 20px}h1{margin:10px 0;font-size:clamp(26px,4vw,42px)}p,.muted{color:#8b949e}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:12px;font:inherit}input{flex:1;min-width:190px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:10px 14px;border-radius:9px;cursor:pointer}.tabs button.active{background:#1f6feb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin:20px 0}.card{border:1px solid #30363d;background:#161b22;border-radius:14px;padding:20px;min-width:0}.card h2{font-size:19px;overflow-wrap:anywhere}.card a{color:#79c0ff;text-decoration:none}.pill{font-size:12px;border:1px solid #30363d;border-radius:99px;padding:5px 9px;display:inline-block;margin-right:5px}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:18px;color:#8b949e;font-size:13px}#compare{display:none}table{width:100%;border-collapse:collapse;min-width:600px}td,th{border-bottom:1px solid #30363d;padding:12px;text-align:left}th{color:#8b949e}#comparisonWrap{overflow:auto}footer{font-size:13px;color:#8b949e}</style></head>
<body><header><p>✦ OPEN SOURCE COLLECTION</p><h1>GitHub 酷東西收藏庫</h1><p>值得收藏的開源專案，一站搜尋、分類與比較。尚未查證的資料明確標示「待確認」。</p><nav class="tabs"><button class="active" id="browseBtn">專案總覽</button><button id="compareBtn">類似專案比較</button></nav></header><main><section id="browse"><div class="bar"><input id="search" placeholder="搜尋專案、分類或介紹…" aria-label="搜尋"><select id="category" aria-label="分類"><option value="">所有分類</option></select><select id="sort" aria-label="排序"><option value="name">名稱 A–Z</option><option value="stars">Star 數高到低</option></select></div><p id="count" class="muted"></p><div class="grid" id="cards"></div></section><section id="compare"><h2>類似專案比較</h2><p>選擇分類，並列比較同類型專案；資料不足時不做優劣排名。</p><select id="compareCategory" aria-label="比較分類"></select><div id="comparisonWrap"><table><thead><tr><th>名稱</th><th>Stars</th><th>用途</th><th>安裝難度／平台</th><th>維護狀態</th></tr></thead><tbody id="compareRows"></tbody></table></div></section></main><footer>資料僅在手動匯入或更新時刷新。Star 數與維護狀態並非即時資訊。</footer>
<script>
let projects=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const txt=v=>v===null||v===undefined||v===''?'待確認':String(v);
function render(){const q=$('search').value.trim().toLocaleLowerCase(),cat=$('category').value;let list=projects.filter(p=>(!cat||p.category===cat)&&[p.name,p.id,p.description,p.category,p.recommendation].some(v=>String(v||'').toLocaleLowerCase().includes(q)));list.sort($('sort').value==='stars'?(a,b)=>(b.stars??-1)-(a.stars??-1)||a.name.localeCompare(b.name): (a,b)=>a.name.localeCompare(b.name));$('count').textContent='共 '+list.length+' 個專案';$('cards').innerHTML=list.map(p=>'<article class="card"><span class="pill">'+esc(p.category)+'</span><h2><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.name)+' ↗</a></h2><p>'+esc(txt(p.description))+'</p><p><strong>用途：</strong>'+esc(txt(p.recommendation))+'</p><p><strong>安裝：</strong>'+esc(txt(p.installation))+'</p><div class="meta"><span>★ '+esc(txt(p.stars))+'</span><span>'+esc(txt(p.maintenance))+'</span></div></article>').join('')||'<p>沒有符合的專案。</p>'}
function compare(){const cat=$('compareCategory').value;const list=projects.filter(p=>p.category===cat);$('compareRows').innerHTML=list.map(p=>'<tr><td><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.name)+'</a></td><td>'+esc(txt(p.stars))+'</td><td>'+esc(txt(p.recommendation))+'</td><td>'+esc(txt(p.installation))+'</td><td>'+esc(txt(p.maintenance))+'</td></tr>').join('')||'<tr><td colspan="5">尚無可比較的專案</td></tr>'}
function tab(which){$('browse').style.display=which==='browse'?'block':'none';$('compare').style.display=which==='compare'?'block':'none';$('browseBtn').classList.toggle('active',which==='browse');$('compareBtn').classList.toggle('active',which==='compare');if(which==='compare')compare()}
$('browseBtn').onclick=()=>tab('browse');$('compareBtn').onclick=()=>tab('compare');['search','category','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('compareCategory').onchange=compare;
fetch('./data/projects.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{projects=data;const cats=[...new Set(projects.map(p=>p.category))].sort();for(const c of cats){for(const id of ['category','compareCategory']){const o=document.createElement('option');o.value=c;o.textContent=c;$(id).append(o)}}render();compare()}).catch(e=>{$('cards').textContent='讀取資料失敗：'+e.message});
</script></body></html>
